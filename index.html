<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grovix - Bold Ideas That Start With Vision</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scroll-wrapper">
        <div class="reactive-bg"></div>
        <div class="reactive-bg-white"></div>
        <div class="noise-overlay"></div>
    
    <header class="navbar">
        <div class="logo">GROVIX</div>
        <nav class="nav-links">
            <a href="#">Insights</a>
            <a href="#">Solutions</a>
            <a href="#">Pricing</a>
        </nav>
        <div class="auth-buttons">
            <a href="#" class="login-btn">Login</a>
            <a href="#" class="try-now-btn">Try Now</a>
        </div>
    </header>

    <main class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">
                <span class="line"><span class="word">Bold</span> <span class="word">Ideas</span> <span class="word">That</span></span><br>
                <span class="line"><span class="word">Start</span> <span class="word">With</span> <span class="word">Vision.</span></span>
            </h1>
            <p class="hero-subtitle">
                We help modern brands craft digital stories that<br>
                inspire action and drive results.
            </p>
            <a href="#" class="get-in-touch-btn">Get In Touch <span class="arrow">↗</span></a>
        </div>
        
        <div class="hands-container">
            <img src="images/robotic_hand.png?v=2" alt="Robotic Hand" class="hand robotic-hand" id="robotic-hand">
            <div class="big-bang-circle" id="big-bang-circle"></div>
            <div class="spark"></div>
            <img src="images/human_hand.png?v=2" alt="Human Hand" class="hand human-hand" id="human-hand">
        </div>
    </main>

    <footer class="trusted-section">
        <p class="trusted-text">Trusted by teams of every scale</p>
        <div class="logos-container">
            <div class="logo-item">MERCURY</div>
            <div class="logo-item">ramp ↗</div>
            <div class="logo-item">HEX</div>
            <div class="logo-item">▲ Vercel</div>
            <div class="logo-item">descript</div>
            <div class="logo-item">Cash App</div>
            <div class="logo-item">SUPERCELL</div>
            <div class="logo-item">runway</div>
        </div>
    </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
